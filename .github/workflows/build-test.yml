name: Build Test MCP Packages

on:
  push:
    branches: [ main, 'refactor/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Validate flake structure (fast, no build)
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25

      - name: Validate flake outputs structure
        run: |
          nix flake check --no-build

  # Build each package in parallel
  build:
    runs-on: ubuntu-latest
    needs: flake-check
    strategy:
      matrix:
        package:
          - ssh-mcp
          - codebase-memory-mcp
          - google-colab-mcp
          - telegram-mcp
          - github-mcp-server
          - tavily-mcp
          - server-memory
          - agentmemory
          - sequential-thinking
          - docker-hub-mcp
          - obsidian-second-brain-mcp
          - scrapling
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-mcp
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build package
        run: |
          nix build ".#packages.x86_64-linux.${{ matrix.package }}" --no-link -L
